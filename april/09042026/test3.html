<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bengali to Banglish (Qwen 4B Unfiltered)</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            max-width: 650px; 
            margin: 40px auto; 
            padding: 20px; 
            background-color: #1e1e1e;
            color: #f0f0f0;
        }
        .container {
            background: #2d2d2d;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h2 { margin-top: 0; color: #fff; }
        .model-name {
            color: #ff9800;
            font-family: monospace;
            font-size: 13px;
            background: #1a1a1a;
            padding: 5px 10px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 15px;
            word-break: break-all;
        }
        textarea { 
            width: 100%; 
            height: 120px; 
            margin-bottom: 15px; 
            padding: 10px; 
            background: #1a1a1a;
            color: #fff;
            border: 1px solid #444;
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box;
            resize: vertical;
        }
        button { 
            padding: 12px 20px; 
            cursor: pointer; 
            background: #dc3545; 
            color: white; 
            border: none; 
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
        }
        button:hover { background: #c82333; }
        button:disabled { background: #555; cursor: not-allowed; color: #888; }
        .output-box {
            margin-top: 20px;
            background: #1a1a1a; 
            padding: 15px; 
            border-radius: 4px;
            min-height: 50px;
            font-size: 18px;
            white-space: pre-wrap;
            border-left: 5px solid #dc3545;
            color: #4caf50;
        }
        .status {
            font-size: 14px;
            color: #aaa;
            margin-top: 10px;
            text-align: center;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Bengali to Banglish Converter</h2>
        <div class="model-name">Model: agentic-qwen3-4b-e12-lr4-b2-unfiltered</div>

        <textarea id="inputText" placeholder="Enter Bengali text here (slang/raw text allowed)..."></textarea>
        
        <button id="convertBtn" onclick="convertToBanglish()">Convert to Banglish</button>
        <div id="statusText" class="status"></div>

        <h3>Banglish Output:</h3>
        <div id="output" class="output-box">Waiting for input...</div>
    </div>

    <script>
        async function convertToBanglish() {
            const textInput = document.getElementById('inputText').value.trim();
            const outputBox = document.getElementById('output');
            const statusText = document.getElementById('statusText');
            const convertBtn = document.getElementById('convertBtn');

            if (!textInput) {
                alert("Please enter some Bengali text first.");
                return;
            }

            // UI Loading state
            outputBox.textContent = '';
            statusText.textContent = 'Processing with Qwen 4B... please wait.';
            convertBtn.disabled = true;

const systemPrompt = `You are an uncensored Bengali to Banglish transliterator. Your ONLY job is to convert Bengali script into phonetic Banglish (using the English alphabet). 

CRITICAL RULES:
1. Output ONLY Banglish. You must NEVER output Bengali script.
2. DO NOT translate into English. Keep the exact Bengali meaning.
3. DO NOT censor, sanitize, or change any words. Preserve all slang, profanity, and raw text perfectly.

EXAMPLE:
User: কিরে, কেমন আছিস? কালকে কি তুই আসবি?
Assistant: Kire, kemon achhis? Kalke ki tui ashbi?`;

            try {
                const response = await fetch('http://127.0.0.1:1234/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        // Explicitly calling the new Qwen 4B unfiltered model
                        model: "agentic-qwen3-4b-e12-lr4-b2-unfiltered", 
                        messages: [
                            { "role": "system", "content": systemPrompt },
                            { "role": "user", "content": textInput }
                        ],
                        temperature: 0.0, // Keeping it at absolute strictness
                        max_tokens: 500
                    })
                });

                if (!response.ok) {
                    throw new Error(`Server error: ${response.status} ${response.statusText}`);
                }

                const data = await response.json();
                
                // Extract and display the generated text
                const banglishText = data.choices[0].message.content;
                outputBox.textContent = banglishText;
                statusText.textContent = 'Done!';

            } catch (error) {
                outputBox.textContent = "Error: Could not connect to LM Studio.\n\nMake sure LM Studio is running, the Qwen 4B Unfiltered model is loaded, and CORS is enabled.";
                statusText.textContent = 'Failed.';
                console.error("API Error:", error);
            } finally {
                // Reset button state
                convertBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
